ext {
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    cordovaAndroidVersion = project.hasProperty('cordovaAndroidVersion') ? rootProject.ext.cordovaAndroidVersion : '14.0.1'
    androidxCoordinatorLayoutVersion = project.hasProperty('androidxCoordinatorLayoutVersion') ? rootProject.ext.androidxCoordinatorLayoutVersion : '1.3.0'
    coreSplashScreenVersion = project.hasProperty('coreSplashScreenVersion') ? rootProject.ext.coreSplashScreenVersion : '1.0.1'
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.7.0'
    compileSdkVersion = 36
    minSdkVersion = 24
    targetSdkVersion = 36
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

repositories {
    google()
    mavenCentral()
}

if (!project.hasProperty('cdvPluginPostBuildExtras')) {
    ext.cdvPluginPostBuildExtras = []
}

for (def func : cdvPluginPostBuildExtras) {
    func()
}

// Standard Capacitor repository wiring (was missing, which broke Maven
// resolution of org.apache.cordova:framework and the androidx deps).
apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// The workspace has JDK 17 (no JDK 21), so pin every Android subproject —
// including Capacitor's — to Java 17 bytecode.
subprojects {
    afterEvaluate {
        if (it.hasProperty('android')) {
            android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}
